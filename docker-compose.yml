services:
  mongo:
    image: mongo:7
    container_name: studysphere-mongo
    ports:
      - "27017:27017"
    volumes:
      - studysphere_mongo:/data/db

  redis:
    image: redis:7-alpine
    container_name: studysphere-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: studysphere-api
    env_file:
      - server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/studysphere
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis

volumes:
  studysphere_mongo:
